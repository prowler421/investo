[project]
name = "investo"
version = "0.1.0"
description = "Fundamental due-diligence reports for NASDAQ-listed companies, generated from SEC filings"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Itay Ozery", email = "prowler421@gmail.com" }]
keywords = ["sec", "edgar", "xbrl", "fundamentals", "valuation", "dcf"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies through M3. The rest arrive with the milestone that imports them —
# statsmodels / pandas in M5. Declaring them early means every `uv sync` pays for a package nothing
# imports, and a pin nobody has exercised drifts out of date before its first use.
dependencies = [
    "typer>=0.19,<0.20",
    # Pinned even though typer already requires it. typer 0.19 declares `click>=8.0.0` with no
    # ceiling, and a fresh resolve therefore picks the newest Click — which the non-vendored
    # typer line was never made compatible with. Without this, `uv sync` on a clean machine can
    # produce a combination that fails at import, and the failure looks like investo's bug.
    "click>=8.2.1,<8.4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.11,<3",
    # M1a. 0.28.1 is the current stable; 1.0 is still at `1.0.dev2` and unreleased. The `<0.29`
    # ceiling because a 0.x minor is a breaking change by convention.
    "httpx>=0.28,<0.29",
    # M1b. iXBRL extraction from DEF 14A (DESIGN.md §6.9) and text extraction from filing bodies.
    # Form 4 and 13D/G are plain XML and use `xml.etree.ElementTree` from the stdlib, so this is
    # the proxy/document path only.
    "lxml>=5,<7",
    # M3. The chart API is stable across minors; a major is where the default style changes, and a
    # default-style change is a byte-identical-output failure (DESIGN.md §11) with no commit of ours
    # to blame. Brings `numpy` and `pillow` transitively — neither is declared here, because nothing
    # of ours imports them, and `numpy` is in `tests/test_layering.py`'s forbidden-import set for
    # `normalize/` and `report/` precisely so it stays that way. A `numpy.float64` is the `float`
    # ban's back door: constructed by no `float()` call, containing no float literal.
    "matplotlib>=3.10,<4",
    # M3. 3.1.6 is the floor because the sandbox-escape fixes through the 3.1.x line matter for a
    # template engine that will render filing text at M6.
    "jinja2>=3.1.6,<4",
    # M3. DESIGN.md §9.0 requires >=69.0: CVE-2025-68616 (SSRF via HTTP redirect, which defeats a
    # custom `url_fetcher` entirely and is therefore not mitigable in our code), CVE-2026-49452 (CSS
    # injection via presentational hints), and `use`-tag inheritance fixed in 69.0. The `<70` ceiling
    # is not caution about bugs — a renderer change is exactly what §11's byte-identical gate is
    # built to detect, so an open major turns the gate into a source of false alarms.
    #
    # This is the first dependency `uv sync` cannot satisfy alone: WeasyPrint renders through Pango
    # and cairo, which come from the platform. README § Quickstart says so.
    "weasyprint>=69,<70",
]

# yfinance is an *extra*, not a dependency — docs/m1/README.md § Why yfinance is an extra, and
# spec question 8. DESIGN.md §4.3 calls it dev convenience only, notes its own README describes
# it as intended for personal use, and concludes it is not a defensible base for anything shared
# or commercial. A default dependency contradicts all three: it puts a scraper and its
# TLS-impersonation chain into every install, including one made by someone who set
# `price_provider = "tiingo"` and will never import it. The adapter ships; the dependency is
# opt-in, and `yfinance_.py` imports lazily with a ConfigError naming this extra.
#
# `>=1.4` because curl_cffi became optional with a `requests` fallback at 1.4.0; `<2` because the
# data source has no contract and a major bump is where that shows up.
[project.optional-dependencies]
yfinance = ["yfinance>=1.4,<2"]

[project.scripts]
investo = "investo.cli:app"

[project.urls]
Repository = "https://github.com/prowler421/investo"

# Development dependency group (PEP 735). Installed by default with `uv sync`.
#
# Ruff and BasedPyright are pinned to a minor and a major series respectively because both are
# CI gates, and a linter or type checker that drifts under you turns a green branch red with no
# commit to blame. The specifiers alone do not deliver that — `uv.lock` plus CI's
# `uv sync --frozen` is what actually pins the resolved version.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
    "basedpyright>=1.39,<2",
    "pre-commit>=4.0",
    # httpx mocking. DESIGN.md §11 prescribes `responses`, which patches `requests` and cannot
    # mock httpx — spec question 3, a tooling correction rather than a design change. respx 0.22
    # requires httpx >=0.25, which the pin above satisfies.
    "respx>=0.22,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investo"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is the formatter's job, not the linter's

    # `__all__` ordering. Modules list exports in dependency order — primitives first, then
    # what is built on them — which reads as documentation of the layer. An isort-style sort
    # scrambles that for no gain.
    "RUF022",
]

# RUF001/2/3 flag "ambiguous" Unicode — characters that could be a homoglyph attack. The rule is
# right in general and wrong for this codebase, which uses typographic characters *deliberately*
# and in about thirty places: `FY − (Q1+Q2+Q3)` is a minus sign because it is arithmetic notation,
# `SIC 6000–6499` is an en dash because it is a range, `1.8×` is a multiplication sign.
#
# Allowlisting the four characters rather than switching the rules off, because the rules are
# protecting something real — a Cyrillic `а` in an identifier, a homoglyph in a URL string — and a
# blanket ignore would give that up to avoid rewriting prose. A new confusable still fails the
# build, which is the behaviour worth keeping.
#
# One of these is not decoration at all. U+2212 is the character `report/format.py` prints on every
# negative figure — argued in that module and asserted by
# `test_format::test_a_negative_uses_the_typographic_minus`, because a right-aligned column whose
# negatives are a hyphen narrower than its positives reads as broken. Replacing it to satisfy a lint
# would undo a decision that has a test.
allowed-confusables = [
    "−",  # U+2212 MINUS SIGN — arithmetic notation, and format.py's printed negative
    "–",  # U+2013 EN DASH — numeric and date ranges
    "×",  # U+00D7 MULTIPLICATION SIGN — "2.3× the estimate", "price × shares"
    "’",  # U+2019 RIGHT SINGLE QUOTATION MARK — the HTML entity documents.py decodes
]

# U+00A0 is deliberately **not** allowlisted. It appears once, in `ingest/edgar/documents.py`, in
# the `.replace()` call that strips it — and unlike the four above it is invisible, so an accidental
# one pasted into a string literal is a bug nobody would see. Allowlisting it repo-wide to permit
# the one line that removes it would switch off the only detector for the case that actually
# matters. That line carries a `noqa` instead.

[tool.ruff.lint.per-file-ignores]
# No B008 exemption for cli.py, deliberately. Typer's older idiom puts a `typer.Option(...)`
# call in a default argument, which is what B008 exists to catch; cli.py uses the
# `Annotated[T, typer.Option(...)]` form instead, so the rule stays on everywhere.

# Tests may use assert-heavy patterns and short fixture names.
#
# SIM300 ("Yoda condition") is off for tests only, and the reason is that it is reading these
# assertions backwards. Every one it fires on has the shape `assert ALLOWLIST == {a, b, c}` — a
# pinned constant compared against the set it must hold — and SIM300 sees the literal on the right
# and asks for `{a, b, c} == ALLOWLIST`, which says the same thing and reads as though the literal
# were the subject. It is not: the constant is, and these tests exist precisely so that *changing
# the constant* is a visible edit. Left on for `src/`, where the rule catches what it is for.
"tests/**" = ["N802", "N803", "N806", "SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["investo"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# BasedPyright — static type checking
# ---------------------------------------------------------------------------
# ROADMAP M0 says `mypy --strict`. BasedPyright in strict mode is the equivalent gate, chosen so
# this repo uses the same type checker as the sibling `tradipy` — same Makefile target, same CI
# step, same pre-commit hook. Not the same *setting*: tradipy runs `standard`, this runs
# `strict`, because M0 asks for strict and a greenfield codebase can afford it where a retrofit
# cannot. The intent M0 states is what matters — the CLI and config layer type-check under a
# strict setting from the first commit.
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
# `tests/fixtures/typing` is excluded because every file in it is *supposed* to fail. They are the
# violation tests for the two guarantees that cannot be checked at runtime — DESIGN.md §5.4's
# distinct share-count types, and `Accession` exposing no CIK — and `test_typing.py` runs
# basedpyright over that directory itself and asserts each file errors. Without this exclusion,
# `make typecheck` fails on files whose whole purpose is to fail.
exclude = ["**/__pycache__", ".venv", "tests/fixtures/typing"]
reportMissingTypeStubs = false

# BasedPyright's own additions on top of pyright's strict set. `strict` already leaves all four
# of these off or at hint level, so these lines change nothing today — they are stated so that a
# future release tightening `strict`'s defaults cannot turn a green branch red without a commit,
# which is the same reason the tool itself is version-pinned above.
#
#   - reportAny / reportExplicitAny: pydantic-settings and typer expose `Any` at their
#     boundaries. Enforcing these means an ignore comment at every call site, which teaches the
#     habit of writing ignore comments.
#   - reportUnusedCallResult: sub-app registration and `print` both return values nobody wants.
#   - reportUnusedParameter: a pytest fixture is requested by declaring a parameter and never
#     reading it (`configured` in the CLI tests), and M0's command bodies accept flags they do
#     not yet consume. Both are unused parameters that mean something.
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnusedParameter = false

# `reportUnknown*` under `ingest/`, and the reason is the one two paragraphs up, applied to the
# layer it was always going to bite. **[M3 — and this is the first milestone in which basedpyright
# has actually run.]**
#
# The comment above disables `reportAny` because *"pydantic-settings and typer expose `Any` at their
# boundaries, and enforcing these means an ignore comment at every call site."* `ingest/` is that
# same argument at ten times the scale: `json.loads` returns `Any`, every SEC payload is untyped by
# construction, and pyright propagates the resulting `Unknown` through every subscript and `.get()`
# below it. **Turning an untyped payload into typed rows is precisely what these parsers are for** —
# the `Unknown` is their input, not a defect in them, and `RawFact`, `FilingRow`, `TickerRow` and
# `FrameRow` are all fully typed on the way out. That boundary is where the checking should happen
# and it does.
#
# Scoped to `ingest/` with an execution environment rather than switched off globally, deliberately.
# These rules earn their place everywhere the types are ours: `normalize/`, `report/`, `domain/` and
# the commands stay strict, and that is where a genuinely unknown type would mean something.
#
# The alternative is real and is not being dismissed: annotate each payload with a `TypedDict` and
# validate at the boundary. It is worth doing, it is roughly a day, and it is **M1's debt rather
# than M3's** — recorded in ROADMAP so it is a decision rather than a silence.
[[tool.basedpyright.executionEnvironments]]
root = "src/investo/ingest"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `-m "not network"` so `make test` and CI both skip the live tests without anyone remembering to.
# Since CI sets no INVESTO_* variables (CLAUDE.md convention 7), a network test that leaked into
# the default selection would *fail* rather than quietly pass — which is the behaviour convention 7
# exists to produce, and the reason the deselection is here rather than in the Makefile.
addopts = "-q --strict-markers -m 'not network and not spike'"
markers = [
    "spec: asserts a rule stated normatively in DESIGN.md or ROADMAP.md",
    "surface: asserts the CLI's documented flag surface, per README.md § Usage",
    "network: reaches the real internet; deselected by default, needs INVESTO_SEC_USER_AGENT",
    "typing: runs basedpyright over a snippet and asserts the diagnostic",
    # M3. `tests/spike_renderer.py` writes files and prints rather than asserting — its output is a
    # decision, recorded in docs/m3/SPIKE.md, not a pass/fail. Deselected for the same reason
    # `network` is: a run that is not a test should not be able to fail the build, and should not
    # cost anyone ten seconds on every `make test`.
    "spike: writes artifacts and prints findings; run by a person, deselected by default",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["investo"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# `fail_under` is still unset, and this is the one M1 commitment not yet honoured — deliberately,
# because honouring it wrongly is worse than late.
#
# docs/m1/06-testing.md §7 specifies the procedure: run `make coverage` once M1 is green, set
# `fail_under` to the measured total **rounded down to the nearest 5**, and put the measured figure
# in the commit message so the next person can tell whether coverage moved or the floor did.
# Rounded down rather than exact, because a floor equal to the measurement fails on any refactor
# that removes a covered line, and a gate that fires on non-events gets raised past the point of
# meaning.
#
# It is not set here because the measurement has not been taken: the environment this milestone was
# written in cannot reach PyPI, so httpx and respx are not installed and the suite has not run. A
# number invented to look plausible is exactly the gate-that-means-nothing this comment has warned
# against since M0. Run `make coverage` and set it.
