[project]
name = "investo"
version = "0.1.0"
description = "Fundamental due-diligence reports for NASDAQ-listed companies, generated from SEC filings"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Itay Ozery", email = "prowler421@gmail.com" }]
keywords = ["sec", "edgar", "xbrl", "fundamentals", "valuation", "dcf"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Office/Business :: Financial :: Investment",
]

# M0 runtime dependencies only: the CLI shell and the config layer.
#
# The heavy ones arrive with the milestone that needs them, not now — httpx in M1, matplotlib
# / jinja2 / weasyprint in M3, statsmodels / numpy in M5. Declaring them early means every
# `uv sync` pays for a package nothing imports, and a pin nobody has exercised drifts out of
# date before its first use.
dependencies = [
    "typer>=0.19,<0.20",
    # Pinned even though typer already requires it. typer 0.19 declares `click>=8.0.0` with no
    # ceiling, and a fresh resolve therefore picks the newest Click — which the non-vendored
    # typer line was never made compatible with. Without this, `uv sync` on a clean machine can
    # produce a combination that fails at import, and the failure looks like investo's bug.
    "click>=8.2.1,<8.4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.11,<3",
]

[project.scripts]
investo = "investo.cli:app"

[project.urls]
Repository = "https://github.com/prowler421/investo"

# Development dependency group (PEP 735). Installed by default with `uv sync`.
#
# Ruff and BasedPyright are pinned to a minor and a major series respectively because both are
# CI gates, and a linter or type checker that drifts under you turns a green branch red with no
# commit to blame. The specifiers alone do not deliver that — `uv.lock` plus CI's
# `uv sync --frozen` is what actually pins the resolved version.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<0.17",
    "basedpyright>=1.39,<2",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investo"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is the formatter's job, not the linter's

    # `__all__` ordering. Modules list exports in dependency order — primitives first, then
    # what is built on them — which reads as documentation of the layer. An isort-style sort
    # scrambles that for no gain.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# No B008 exemption for cli.py, deliberately. Typer's older idiom puts a `typer.Option(...)`
# call in a default argument, which is what B008 exists to catch; cli.py uses the
# `Annotated[T, typer.Option(...)]` form instead, so the rule stays on everywhere.

# Tests may use assert-heavy patterns and short fixture names.
"tests/**" = ["N802", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["investo"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# BasedPyright — static type checking
# ---------------------------------------------------------------------------
# ROADMAP M0 says `mypy --strict`. BasedPyright in strict mode is the equivalent gate, chosen so
# this repo uses the same type checker as the sibling `tradipy` — same Makefile target, same CI
# step, same pre-commit hook. Not the same *setting*: tradipy runs `standard`, this runs
# `strict`, because M0 asks for strict and a greenfield codebase can afford it where a retrofit
# cannot. The intent M0 states is what matters — the CLI and config layer type-check under a
# strict setting from the first commit.
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
reportMissingTypeStubs = false

# BasedPyright's own additions on top of pyright's strict set. `strict` already leaves all four
# of these off or at hint level, so these lines change nothing today — they are stated so that a
# future release tightening `strict`'s defaults cannot turn a green branch red without a commit,
# which is the same reason the tool itself is version-pinned above.
#
#   - reportAny / reportExplicitAny: pydantic-settings and typer expose `Any` at their
#     boundaries. Enforcing these means an ignore comment at every call site, which teaches the
#     habit of writing ignore comments.
#   - reportUnusedCallResult: sub-app registration and `print` both return values nobody wants.
#   - reportUnusedParameter: a pytest fixture is requested by declaring a parameter and never
#     reading it (`configured` in the CLI tests), and M0's command bodies accept flags they do
#     not yet consume. Both are unused parameters that mean something.
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnusedParameter = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "spec: asserts a rule stated normatively in DESIGN.md or ROADMAP.md",
    "surface: asserts the CLI's documented flag surface, per README.md § Usage",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["investo"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# No `fail_under` yet, deliberately. A floor is a claim that coverage has not collapsed, and
# it can only be set from a measurement. M0's codebase is a CLI shell whose command bodies are
# unimplemented by design; a number picked here would be picked to match whatever today's run
# scores, which is how a gate comes to mean nothing. Set it in M1 from a measured figure, and
# record that figure in the commit message.
